<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sport Live">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css">
  <title>Sport Live</title>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><b>SPORT <span>LIVE</span></b></div></div><div class="topbar-actions"><button id="searchToggle" class="round search-toggle" aria-label="Rechercher" aria-expanded="false">⌕</button><button id="installHint" class="round" aria-label="Installer">＋</button></div><div class="search-popover" id="searchPopover" hidden><div class="search-input-wrap"><span>⌕</span><input id="globalSearch" type="search" placeholder="Joueur, pilote, match…" autocomplete="off"><button id="searchClose" aria-label="Fermer">×</button></div><div id="searchResults" class="search-results"><p class="search-hint">Rechercher dans le PSG, le padel et la Formule 1.</p></div></div></header>
<main>
  <nav class="sports" aria-label="Sports"><button class="sport active" data-sport="all">Tout</button><button class="sport" data-sport="padel">🎾 Padel</button><button class="sport" data-sport="psg">⚽ PSG</button><button class="sport" data-sport="f1">🏎️ F1</button></nav>
  <div id="events" class="events"></div>
  <section class="section-head news-head"><div><p class="eyebrow">RESTER INFORMÉ</p><h2>À la une</h2></div><span class="muted">Actualités</span></section>
  <div id="news-feed" class="news-feed"><div class="empty">Chargement des actualités…</div></div>
  <section class="section-head"><div><p class="eyebrow">RACCOURCIS</p><h2>Mon espace</h2></div></section>
  <div class="quick-grid"><button class="quick" id="calendarBtn"><strong>▦</strong><b>Calendrier</b><small>Ajouter un événement</small></button><button class="quick" id="navNewsQuick"><strong>▤</strong><b>Actualités</b><small>Les dernières infos sport</small></button></div>
  
</main>
<nav class="bottom-nav"><button id="navHome" class="selected"><span>⌂</span>Accueil</button><button id="navLive"><span>◉</span>Direct</button><button id="navCalendar"><span>▦</span>Calendrier</button><button id="navNews"><span>▤</span>Actus</button></nav>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
